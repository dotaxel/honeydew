name: Android

# Build Android (arm64 + armv7 + x86_64) on the `android` branch and on demand.
on:
  push:
    branches: [android]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
          workspaces: |
            .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK. Install the exact platform, build-tools and NDK
      # that android/app/build.gradle asks for, so Gradle doesn't have to download them.
      - name: Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin | head -n 1)/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Output goes where android/app/build.gradle reads jniLibs: <buildDirectory>/jniLibs,
      # and buildDirectory is ../../target/android. --platform 26 because AAudio needs API 26+.
      # --link-libcxx-shared copies libc++_shared.so next to libhoneydew.so, which the .so needs at runtime.
      - name: Native libraries
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 26 \
            --link-libcxx-shared \
            -o target/android/jniLibs \
            build --release --lib

      # signingConfigs.debug reads android/debug.keystore, which isn't in the repo.
      # Generate it with the standard Android debug credentials if it's missing.
      - name: Debug keystore
        working-directory: android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # HONEYDEW_ANDROID_BASE skips the check for sound assets, which the app downloads at runtime.
      # This produces the same base APK as `tools/android-dist.sh --base`.
      - name: APK
        working-directory: android
        env:
          HONEYDEW_ANDROID_BASE: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name
        id: names
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "apk=honeydew-android-$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.apk }}
          path: target/android/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0
